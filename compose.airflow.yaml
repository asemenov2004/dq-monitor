# Запуск: docker compose -f compose.yaml -f compose.airflow.yaml up -d --build
x-airflow-common: &airflow-common
  image: dq-monitor-airflow:3.3.2
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file: .env
  environment: &airflow-environment
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    WAREHOUSE_DB: ${WAREHOUSE_DB}
    META_DB: ${META_DB}
    DQ_CONNECTION_OVERRIDES: '{"tpch_warehouse":{"host":"postgres","port":5432}}'
    AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_db_local_password}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow_local_password}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "1"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/passwords.json
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_PORT:-8081}
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - airflow-config:/opt/airflow/config
    - airflow-logs:/opt/airflow/logs
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  airflow-init:
    <<: *airflow-common
    command: ["python", "/opt/dq-bootstrap.py", "init"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g

  airflow-api:
    <<: *airflow-common
    command: ["python", "/opt/dq-bootstrap.py", "api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    mem_limit: 1536m

  airflow-scheduler:
    <<: *airflow-common
    command: ["python", "/opt/dq-bootstrap.py", "scheduler"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    mem_limit: 2g

  airflow-dag-processor:
    <<: *airflow-common
    command: ["python", "/opt/dq-bootstrap.py", "dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", "python /opt/dq-bootstrap.py jobs check --job-type DagProcessorJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 45s
    mem_limit: 1536m

volumes:
  airflow-config:
  airflow-logs:
