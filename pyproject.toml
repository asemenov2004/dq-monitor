[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-monitor"
version = "0.1.0"
description = "Система автоматизированного контроля качества данных в хранилище данных"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anton Semenov" }]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "croniter>=6.2,<7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2,<3",
]
# Полигон TPC-H: нужен только для экспериментов, ядру не требуется
stand = [
    "duckdb>=1.1",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

# Шаблон миграций не .py-файл, без этой строки он не попадёт в установленный пакет
[tool.setuptools.package-data]
"dq_monitor.meta" = ["migrations/script.py.mako"]
"dq_monitor.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Миграции генерирует Alembic: длинные строки DDL и его стиль аннотаций не правим
"src/dq_monitor/meta/migrations/versions/*" = ["E501", "UP", "W291"]
