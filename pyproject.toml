[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-monitor"
version = "0.1.0"
description = "Система автоматизированного контроля качества данных в хранилище данных"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anton Semenov" }]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Полигон TPC-H: нужен только для экспериментов, ядру не требуется
stand = [
    "duckdb>=1.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
